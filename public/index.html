<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Euskara Praktika</title>
<meta name="theme-color" content="#C8281F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Euskara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="olentzero.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Euskara Praktika · sistema visual "Plaza": Bricolage Grotesque + Inter, superficies planas, una sola elevación por pantalla (la acción principal), esquinas 12 px, espaciado en múltiplos de 8. Euskera siempre como lengua meta; castellano/inglés como apoyo, pequeño. */
:root{
  --bg:#F7F2E8; --card:#FFFDF8; --ink:#161412; --muted:#6A645B; --soft:#EFE8D8; --line:rgba(22,20,18,.14); --line2:rgba(22,20,18,.3); --line-soft:rgba(22,20,18,.14);
  --red:#C1281E; --red-deep:#A11F18; --red-soft:#F7D9D6; --green:#1A7A45; --green-deep:#0F5A2D; --green-soft:#D7EBDD;
  --ochre:#EFC23A; --ochre-soft:#FBEBB8; --ochre-ink:#8A6A00; --cream:#FFF9EC; --blue:#1F4E79; --blue-soft:#DCE7F3; --on-color:rgba(255,249,236,.85);
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,sans-serif; --r:12px; --rs:8px; --bw:1.5px; --bw:1.5px;
  --sh-primary:0 8px 18px -10px rgba(193,40,30,.6); --sh-sheet:0 -16px 40px -24px rgba(0,0,0,.45); color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root{ --bg:#1C1B18; --card:#26241F; --ink:#FFF9EC; --muted:#B8B2A6; --soft:#2E2C26; --line:rgba(255,249,236,.14); --line2:rgba(255,249,236,.38); --line-soft:rgba(255,249,236,.14); --red-soft:#4A1F1B; --green-soft:#1C3A27; --ochre-soft:#4A3C12; --ochre-ink:#F2C230; --blue:#7FA8DA; --blue-soft:#1F2E42; --sh-primary:0 8px 18px -10px rgba(0,0,0,.6); color-scheme:dark } .toast{background:#FFF9EC;color:#141414} .stab td.win,.drill .instr{color:#F2C230} }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.notabs .app{padding-bottom:0}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.15;letter-spacing:-.01em}
h1{font-size:24px} h2{font-size:22px} h3{font-size:19px}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.app>*{animation:rise .22s ease-out both}
/* botones: una etiqueta (euskera); el apoyo solo en .bi */
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:52px;padding:12px 18px;border:var(--bw) solid transparent;background:var(--ink);color:var(--cream);font-family:var(--display);font-weight:700;font-size:17px;line-height:1.15;text-align:center;border-radius:var(--r);transition:transform .12s,box-shadow .2s,opacity .2s}
.btn small{display:none;font-family:var(--body);font-size:12px;font-weight:500;color:var(--on-color);margin-top:2px}
.btn.bi small{display:block}
.btn.red{background:var(--red);box-shadow:var(--sh-primary)}
.btn.green{background:var(--green)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2);box-shadow:none} .btn.ghost small{color:var(--muted)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:15px;width:auto;display:inline-flex;flex-direction:row;gap:8px}
.btn:disabled{opacity:.35;box-shadow:none}
.btn:active:not(:disabled){transform:scale(.985)}
@media (prefers-color-scheme:dark){ .btn{background:#FFF9EC;color:#141414} .btn small{color:#5A5A5A} .btn.red,.btn.green{color:#FFF9EC} .btn.red small,.btn.green small{color:var(--on-color)} .btn.ghost{color:var(--ink)} }
/* etiquetas de sección: euskera + apoyo en línea */
.eyebrow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;color:var(--ink);line-height:1.2}
.eyebrow::after{content:attr(data-es);font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted)}
.eyebrow:not([data-es])::after{content:none}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:var(--r)}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
.err{color:var(--red);font-weight:600;min-height:1.4em;font-size:14px}
.hint{font-size:13px;color:var(--muted);font-weight:500;line-height:1.45}
.ic{display:inline-flex;flex:none;align-items:center;justify-content:center}
.ic svg{width:1em;height:1em}
/* cabecera compacta */
.head{position:relative;overflow:hidden;background:var(--red);color:var(--cream);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:18px}
.head .lb{position:absolute;right:-56px;top:-46px;width:200px;height:200px;color:var(--cream);opacity:.12;pointer-events:none}
.head .lb svg{width:100%;height:100%}
.head .row{position:relative}
.head .sub{font-size:13px;font-weight:500;color:var(--on-color);line-height:1.35}
.head h1{font-size:24px;color:var(--cream)}
.head .streak{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:rgba(255,249,236,.16);color:var(--cream);font-family:var(--display);font-weight:700;font-size:14px;flex:none}
.head .streak svg{width:16px;height:16px;color:var(--ochre)}
.avatar{width:40px;height:40px;border:0;background:var(--cream);color:var(--red);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;flex:none;cursor:pointer;border-radius:999px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:13px;background:var(--soft);border-radius:999px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.g{background:var(--green);color:var(--cream);border-color:transparent} .pill.b{background:var(--blue);color:var(--cream);border-color:transparent} .pill.y{background:var(--ochre);color:#141414;border-color:transparent}
/* pestañas con icono */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#161412;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;color:rgba(255,249,236,.72);font-size:11px;font-weight:600;transition:color .15s}
.tab .ic svg{width:22px;height:22px}
.tab .es{display:none}
.tab.on{color:var(--ochre)}
.tab .badge{position:absolute;top:6px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;border:2px solid #161412}
/* lista de lecciones */
.lrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);padding:12px 14px;color:var(--ink);border-radius:var(--r);transition:transform .12s}
.lrow:active{transform:scale(.99)}
.lrow .n{width:40px;height:40px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);background:var(--soft);border-radius:10px}
.lrow.done .n{background:var(--green);color:var(--cream)}
.lrow .t{flex:1;min-width:0}
.lrow .t strong{display:block;font-family:var(--display);font-weight:700;font-size:16px;line-height:1.2}
.lrow .t small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:2px}
.lrow .ring{flex:none}
.ring{display:inline-block}
.mod{display:flex;align-items:center;gap:12px;padding:6px 2px 2px;margin-top:8px}
.mod .mn{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:999px;background:var(--ink);color:var(--cream);font-family:var(--display);font-weight:700;font-size:15px}
.mod .mn svg{width:18px;height:18px}
.mod.done .mn{background:var(--green)} .mod.locked .mn{background:var(--soft);color:var(--muted)}
.mod .mt{flex:1;min-width:0} .mod .mt b{display:block;font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2} .mod .mt small{display:block;font-size:12px;color:var(--muted)}
.mod.locked .mt{opacity:.6}
.lrow.locked{opacity:.55;background:transparent;border-style:dashed} .lrow.locked .n{background:transparent;border:1px dashed var(--line2);color:var(--muted)} .lrow.locked .n svg{width:16px;height:16px}
.lrow.active{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.planned{display:flex;flex-direction:column;gap:6px;padding:4px 0 10px 48px}
.planned span{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)} .planned span svg{width:14px;height:14px}
.sbar{display:flex;height:8px;overflow:hidden;margin-top:8px;background:var(--soft);border-radius:999px}
.sbar i{display:block;height:100%} .sbar i.t{background:var(--green)} .sbar i.s{background:var(--ochre)}
.slegend{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:4px}
/* huerto */
.garden .gbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--soft)}
.garden .gbar i{display:block;height:100%} .garden .gbar i.t{background:var(--green)} .garden .gbar i.s{background:var(--ochre)}
.garden .glegend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:600;margin-top:12px}
.garden .glegend span{display:inline-flex;align-items:center;gap:6px}
.garden .glegend i{width:10px;height:10px;border-radius:999px;display:inline-block;background:var(--soft);border:1px solid var(--line2)}
.garden .glegend .t i{background:var(--green);border-color:transparent} .garden .glegend .s i{background:var(--ochre);border-color:transparent} .garden .glegend .n{color:var(--muted)}
.quick{display:flex;gap:10px}
.qbtn{flex:1;display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);font-size:14px;font-weight:600;color:var(--ink);text-align:left;transition:transform .12s}
.qbtn:active{transform:scale(.985)} .qbtn:disabled{opacity:.4}
.qbtn .ic svg{width:20px;height:20px}
.today{display:flex;flex-direction:column;gap:14px;padding:18px}
.today .who{display:flex;align-items:center;gap:14px}
.today .who .olen{flex:none;width:52px}
.today .who .olen svg{width:52px;height:auto}
.today .tt{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.15}
.today .ts{font-size:14px;color:var(--muted)}
.nextrow{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);text-align:left;width:100%}
.nextrow .n{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:var(--soft);font-family:var(--display);font-size:16px;font-weight:700;flex:none}
.nextrow .t{flex:1;min-width:0;display:flex;flex-direction:column} .nextrow .t b{font-family:var(--display);font-size:16px;font-weight:700} .nextrow .t small{font-size:13px;color:var(--muted)}
/* pantallas internas: barra superior */
.top{display:flex;align-items:center;gap:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px;margin-bottom:8px}
.top .bar{flex:1;height:8px;overflow:hidden;background:var(--soft);border-radius:999px}
.top .bar i{display:block;height:100%;width:0;background:var(--green);border-radius:999px;transition:width .3s}
.top button[aria-label]{width:40px;height:40px;flex:none;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)!important;background:var(--card);border-radius:999px;font-size:0}
.top button[aria-label] svg{width:20px;height:20px}
.top .eyebrow{font-size:12px;font-family:var(--body);font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase} .top .eyebrow::after{content:none}
.top h2{font-size:22px}
.prompt{display:flex;align-items:center;gap:14px;font-family:var(--display);font-size:24px;font-weight:700;line-height:1.2;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:18px}
.prompt.eu{border-left:6px solid var(--red)}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border:var(--bw) solid var(--line2);background:var(--card);font-size:16px;font-weight:500;color:var(--ink);border-radius:var(--r);transition:transform .12s,background .15s}
.opt:active{transform:scale(.99)}
.opt[aria-pressed="true"]{background:var(--ochre);color:#141414;border-color:transparent}
.opt.ok{background:var(--green);color:var(--cream);border-color:transparent} .opt.bad{background:var(--red);color:var(--cream);border-color:transparent}
input.ans,select.ans{width:100%;font:500 18px var(--body);padding:14px 16px;border:var(--bw) solid var(--line2);background:var(--card);color:var(--ink);border-radius:var(--r);-webkit-appearance:none;transition:box-shadow .15s,border-color .15s}
input.ans:focus{border-color:var(--ink);outline:0;box-shadow:0 0 0 4px rgba(22,20,18,.08)}
input.ans.ok{border-color:var(--green);box-shadow:0 0 0 4px rgba(26,122,69,.14)} input.ans.bad{border-color:var(--red);box-shadow:0 0 0 4px rgba(193,40,30,.14)}
.helps{display:flex;gap:8px;flex-wrap:wrap}
.help{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--ink);background:var(--card);border-radius:999px}
.help svg{width:16px;height:16px}
.help.on{background:var(--ochre);color:#141414;border-color:transparent}
.speak{display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink);flex:none;border-radius:999px}
.speak.big{width:88px;height:88px;margin:10px auto;background:var(--ochre);color:#141414;border-color:transparent}
.speak svg{width:18px;height:18px} .speak.big svg{width:38px;height:38px}
/* hoja de resultado */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:12px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.9,.3,1.05);max-height:85vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:20px 20px 0 0;box-shadow:var(--sh-sheet)}
.sheet.show{transform:none}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet .in::before{content:"";display:block;width:40px;height:4px;border-radius:999px;background:var(--line2);margin:0 auto 2px}
.sheet .mark{flex:none;width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--cream)}
.sheet.ok .mark{background:var(--green)} .sheet.bad .mark{background:var(--red)} .sheet.info .mark{background:var(--ochre);color:#141414}
.sheet .mark svg{width:24px;height:24px}
.sheet h3{font-family:var(--display);font-size:22px;color:inherit}
.sheet.ok h3{color:var(--green)} .sheet.bad h3{color:var(--red)}
@media (prefers-color-scheme:dark){ .sheet.ok h3{color:#7FD39E} .sheet.bad h3{color:#F08A82} }
.sheet .hint{color:var(--muted)}
.sheet .btn:disabled{opacity:.35}
.sh-olen{flex:none;width:44px;height:64px;overflow:hidden;margin-left:auto}
.sh-olen svg{width:44px;height:auto}
.note{display:flex;gap:10px;background:var(--ochre-soft);color:var(--ink);padding:12px 14px;font-size:14px;font-weight:500;line-height:1.45;border-radius:var(--rs)}
.answer-box{background:var(--bg);color:var(--ink);padding:14px 16px;display:flex;align-items:center;gap:10px;border-radius:var(--r)}
.answer-box b{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.15}
.bottom{position:sticky;bottom:0;z-index:5;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);margin-top:16px;box-shadow:0 -14px 14px -10px var(--bg)}
.big{font-family:var(--display);font-weight:700;font-size:52px;line-height:1;color:var(--cream);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);padding:14px;text-align:center;border-radius:var(--r)}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;margin-top:6px}
.stat.g{background:var(--green);color:var(--cream);border-color:transparent} .stat.g span{color:var(--on-color)}
.link{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:14px;color:var(--ink);border-radius:999px}
.chip.on{background:var(--ink);color:var(--cream);border-color:transparent}
.pattern{display:flex;align-items:center;gap:14px;background:#161412;color:#FFF9EC;padding:16px 18px;border-radius:14px}
.pattern .eyebrow{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ochre)} .pattern .eyebrow::after{content:none}
.pattern .pat{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;margin-top:2px}
.pattern .blank{color:var(--ochre);border-bottom:3px solid var(--ochre)}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.v{background:var(--card);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;text-align:left;color:var(--ink);border-radius:var(--r);min-height:112px;transition:transform .12s}
.v:active{transform:scale(.985)}
.v .em{font-size:26px;line-height:1}
.v .em.q{font-size:20px;letter-spacing:-2px;line-height:1.2;overflow-wrap:anywhere}
.v b{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.15;overflow-wrap:anywhere}
.v small{color:var(--muted);font-size:13px;font-weight:500}
.v .tag{position:absolute;top:10px;right:10px;line-height:0}
.v.tree{border-color:var(--green)} .v.sprout{border-color:var(--ochre)}
.tip{display:flex;gap:12px;border:1px solid var(--line);padding:14px 16px;background:var(--card);border-radius:var(--r)}
.tip .ic{width:32px;height:32px;border-radius:999px;background:var(--ochre-soft);color:var(--ochre-ink);flex:none;margin-top:2px} .tip .ic svg{width:18px;height:18px}
.tip b{display:block;font-family:var(--display);font-weight:700;font-size:15px;margin-bottom:2px} .tip p{font-size:14px;color:var(--muted);line-height:1.5}
.dlg{display:flex;flex-direction:column;gap:10px;position:relative;isolation:isolate}
.scene{display:flex;align-items:center;gap:10px;margin:-4px 0 4px;font-weight:600;color:var(--muted);font-size:14px}
.scene span{font-size:28px;line-height:1}
.dlg .line{max-width:88%;padding:12px 14px;border:1px solid var(--line);background:var(--card);display:flex;gap:10px;align-items:center;border-radius:14px 14px 14px 4px}
.dlg .line.b{align-self:flex-end;background:var(--soft);border-radius:14px 14px 4px 14px}
.dlg .eu{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.15} .dlg .es{font-size:12px;color:var(--muted);font-weight:500}

const lev=(a,b)=>{const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];};

}

// ---------- voz (mp3 generados en el servidor) ----------
let VOICE=false, AUDIO=null;
async function checkVoice(){ try{ const r=await fetch("/api/tts/status"); const d=await r.json(); VOICE=!!d.ok; }catch(e){ VOICE=false; } }
let SLOW=false; try{ SLOW=localStorage.getItem("euskara.slow")==="1"; }catch(e){}
function speak(text, onEnd, slow){ if(!VOICE) return false; try{ if(AUDIO){ AUDIO.pause(); AUDIO.onended=null; } AUDIO=new Audio("/api/tts?text="+encodeURIComponent(text)); const rate=(slow===undefined?SLOW:slow)?0.7:1; AUDIO.preservesPitch=true; AUDIO.mozPreservesPitch=true; AUDIO.webkitPreservesPitch=true; AUDIO.playbackRate=rate; if(onEnd) AUDIO.onended=onEnd; AUDIO.onerror=()=>{ VOICE=false; toast(T("Audio no disponible")); }; AUDIO.play().then(()=>{ AUDIO.playbackRate=rate; }).catch(()=>{}); return true; }catch(e){ return false; } }
function speakSeq(list,slow){ let k=0; const go=()=>{ if(k<list.length) speak(list[k++],()=>setTimeout(go,450),slow); }; go(); }
function preload(texts){ if(!VOICE) return; for(const t of texts.slice(0,12)) fetch("/api/tts?text="+encodeURIComponent(t)).catch(()=>{}); }

function wireSpeak(root=app){ root.querySelectorAll("[data-say]").forEach(b=>{ let timer=null, held=false;
  const down=()=>{ held=false; timer=setTimeout(()=>{ held=true; speak(b.dataset.say,null,true); toast("🐢 Poliki · "+T("despacio")); },450); };
  const up=ev=>{ clearTimeout(timer); if(!held){ ev.preventDefault(); speak(b.dataset.say); } };

// Catálogo de ítems: lecciones + personales
function locIn(p){ const w=p.trim(); if(!w) return ""; const last=w.slice(-1).toLowerCase(); return /[aeiou]/.test(last)? w+"n" : w+"en"; }
function locFrom(p){ const w=p.trim(); if(!w) return ""; const l=w.toLowerCase(); const last=l.slice(-1); return l.endsWith("n")? l+"goa" : /[aeiou]/.test(last)? l+"koa" : l+"ekoa"; }
function personalItems(){
  const pr=P.profile||{}; const out=[]; const Name=P.name[0].toUpperCase()+P.name.slice(1);
  out.push({key:"me:naiz",eu:`Ni ${Name} naiz`,es:L2(`Yo soy ${Name}`,`I am ${Name}`),lesson_id:"me",emoji:"🙋"});
  out.push({key:"me:izena",eu:`Nire izena ${Name} da`,es:L2(`Mi nombre es ${Name}`,`My name is ${Name}`),lesson_id:"me",emoji:"✍️"});
  if(pr.age){ out.push({key:"me:adina",eu:`${numEu(pr.age)} urte ditut`,es:`Tengo ${pr.age} años`,lesson_id:"me",emoji:"🎂"}); }
  if(pr.town){ out.push({key:"me:bizi",eu:`Ni ${locIn(pr.town)} bizi naiz`,es:L2(`Yo vivo en ${pr.town}`,`I live in ${pr.town}`),lesson_id:"me",emoji:"🏠"}); }
  if(pr.origin){ out.push({key:"me:nongoa",eu:`Ni ${locFrom(pr.origin)} naiz`,es:L2(`Yo soy de ${pr.origin}`,`I am from ${pr.origin}`),lesson_id:"me",emoji:"🌍"}); }
  if(pr.gender){
    const bro=pr.gender==="neska"?"neba":"anaia", sis=pr.gender==="neska"?"ahizpa":"arreba", mix=pr.gender==="neska"?"neba-arrebak":"anai-arrebak";
    const parts=[]; if(pr.nebak) parts.push(`${bro} ${numEu(pr.nebak)}`); if(pr.ahizpak) parts.push(`${sis} ${numEu(pr.ahizpak)}`);
    const n=(pr.nebak||0)+(pr.ahizpak||0);
    if(n===0) out.push({key:"me:anai",eu:"Ez dut anai-arrebarik",es:"No tengo hermanos",lesson_id:"me",emoji:"🚫"});
    else out.push({key:"me:anai",eu:`${parts.join(" eta ")} ${n===1?"dut":"ditut"}`,es:L2(`Tengo ${[pr.nebak?`${pr.nebak} hermano${pr.nebak>1?"s":""}`:"",pr.ahizpak?`${pr.ahizpak} hermana${pr.ahizpak>1?"s":""}`:""].filter(Boolean).join(" y ")}`,`I have ${[pr.nebak?`${pr.nebak} brother${pr.nebak>1?"s":""}`:"",pr.ahizpak?`${pr.ahizpak} sister${pr.ahizpak>1?"s":""}`:""].filter(Boolean).join(" and ")}`),lesson_id:"me",emoji:"👨‍👩‍👧‍👦"});
    out.push({key:"me:genero",eu:pr.gender==="neska"?"Ni neska naiz":"Ni mutila naiz",es:pr.gender==="neska"?"Yo soy chica":"Yo soy chico",lesson_id:"me",emoji:pr.gender==="neska"?"👧":"👦"});
    out.push({key:"me:mix",eu:mix,es:"hermanos (como lo digo yo)",lesson_id:"me",emoji:"👫"});
  }
  return out;
}
function lessonItems(l){
  const out=[];
  for(const [eu,es,em] of l.pairs) out.push({key:`${l.id}:${norm(eu)}`,eu,es,lesson_id:l.id,emoji:em,count:l.countable&&/^\d+$/.test(es)?+es:null,countEm:l.countable});
  for(const [eu,es] of l.sentences) if(!out.some(o=>norm(o.eu)===norm(eu))) out.push({key:`${l.id}:${norm(eu)}`,eu,es,lesson_id:l.id,chunk:true});
  return out;
}
const catalog=()=>[...LESSONS.flatMap(lessonItems),...personalItems()];
function lessonOf(id){ return LESSONS.find(l=>l.id===id); }
// Desbloqueo lineal: una lección se abre cuando la anterior tiene ≥ 80 % de sus frases introducidas.
function seenPct(l,m){ const its=lessonItems(l); return its.filter(x=>m[x.key]).length/Math.max(1,its.length); }
function firmPct(l,m){ const its=lessonItems(l); return its.filter(x=>m[x.key]&&m[x.key].interval>=7).length/Math.max(1,its.length); }
function unlockedIds(){ const m=imap(); const out=new Set(); for(let i=0;i<LESSONS.length;i++){ if(i===0||seenPct(LESSONS[i-1],m)>=0.8) out.add(LESSONS[i].id); else break; } return out; }
function isUnlocked(l){ return unlockedIds().has(l.id); }
function moduleOf(l){ return MODULES.find(x=>x.id===l.module)||MODULES[0]; }
function moduleProgress(mod,m){ const ls=LESSONS.filter(l=>l.module===mod.id); if(!ls.length) return {seen:0,firm:0,n:0}; const its=ls.flatMap(lessonItems); return {n:its.length,seen:its.filter(x=>m[x.key]).length/its.length,firm:its.filter(x=>m[x.key]&&m[x.key].interval>=7).length/its.length}; }

// Etapa de una frase: 🌱 nueva (no introducida) · 🌿 en estudio · 🌳 firme (intervalo ≥ 7 días)
function stage(it){ if(!it) return {k:"seed",em:"🌱",t:T("nueva")}; if(it.interval>=7) return {k:"tree",em:`<span style="display:inline-flex;width:1em;height:1em;vertical-align:-2px">${LAUBURU}</span>`,t:T("firme")}; return {k:"sprout",em:"🌿",t:T("en estudio")}; }
function daysUntil(due){ const a=new Date(todayStr()+"T12:00:00"), b=new Date(due+"T12:00:00"); return Math.round((b-a)/86400000); }
function dueLabel(it){ const d=daysUntil(it.due); return d<=0?T("toca repasar hoy"):d===1?T("la verás mañana"):T(`la verás en ${d} días`); }
function stageBar(items,m){ const c={seed:0,sprout:0,tree:0}; for(const it of items) c[stage(m[it.key]).k]++; const n=items.length||1; return `<div class="sbar" title="${c.tree} ${T("firmes")} · ${c.sprout} ${T("en estudio")} · ${c.seed} ${T("por ver")}"><i class="t" style="width:${c.tree/n*100}%"></i><i class="s" style="width:${c.sprout/n*100}%"></i></div><small class="slegend"><span style="display:inline-flex;width:11px;height:11px;vertical-align:-1px">${LAUBURU}</span> ${c.tree} · 🌿 ${c.sprout} · 🌱 ${c.seed}</small>`; }

      try{ const perm=await Notification.requestPermission(); if(perm!=="granted"){ toast(T("Sin permiso para avisos")); return; }
        const s2=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(info.key)});
        await api("push/subscribe",{sub:s2.toJSON(),hour:+document.getElementById("phour").value,daily:true,challenges:true}); toast(T("Avisos activados")); renderPushBox(); }
      catch(e){ toast(T("No se pudo activar: ")+(e.message||e)); }

  }
  box.innerHTML=`<div class="row"><span style="font-weight:700">${T("✅ Avisos activados")}</span><span class="spacer"></span><button class="link" id="ptest" style="font-size:13px">${T("Probar")}</button></div>

let SES=null;
const sesKey=()=>"euskara.ses2."+(P?P.id:"");
function saveSes(){ try{ if(SES) localStorage.setItem(sesKey(),JSON.stringify(SES)); }catch(e){} }

const TR=(()=>{ const o={}; for(const [k,v] of Object.entries(window.TRANSFORMS||{})) o[norm(k)]=v; return o; })();
function transformsFor(eu){ return TR[norm(eu)]||[]; }
function buildEx(it, pool){
  const opts=list=>shuffle([it.eu,...shuffle([...new Set(pool.map(p=>p.eu).filter(x=>x!==it.eu))]).slice(0,3)]);
  const ex={key:it.key,eu:it.eu,es:T(it.es),lesson_id:it.lesson_id,emoji:it.emoji||"",opts:opts(),mode:"produce"};
  if(it.count){ ex.mode="count"; ex.visual=qty(it.count,it.countEm||"🍎"); const nums=[...new Set(catalog().filter(p=>p.count&&p.eu!==it.eu).sort((a,b)=>Math.abs(a.count-it.count)-Math.abs(b.count-it.count)).slice(0,8).map(p=>p.eu))]; ex.opts=shuffle([it.eu,...shuffle(nums).slice(0,3)]); }
  else if(!it.isNew && it.reps>=1 && transformsFor(it.eu).length && Math.random()<0.35){ const tr=pick(transformsFor(it.eu)); ex.mode="transform"; ex.from=it.eu; ex.instr=tr.i; ex.to=tr.to; ex.toEs=T(tr.es||""); ex.instr=T(tr.i); ex.opts=shuffle([tr.to,...shuffle([...new Set(pool.map(p=>p.eu).filter(x=>norm(x)!==norm(tr.to)&&norm(x)!==norm(it.eu)))]).slice(0,3)]); }
  else if(VOICE && words(it.eu).length>=2 && Math.random()<0.3) ex.mode="listen";
  else if(Math.random()<0.15 && words(T(it.es)).length<=4) { ex.mode="meaning"; ex.opts=shuffle([T(it.es),...shuffle([...new Set(pool.map(p=>T(p.es)).filter(x=>x!==T(it.es)))]).slice(0,3)]); }
  return ex;
}
function startSession(opts){
  noTabs(); const pool=[...opts.items,...catalog()];
  const ex=[]; for(const it of opts.items){ if(it.isNew){
      const base={key:it.key,eu:it.eu,es:T(it.es),lesson_id:it.lesson_id,emoji:it.emoji||"",visual:it.count?qty(it.count,it.countEm||"🍎"):""};
      ex.push({...base,mode:"learn"});
      const same=pool.filter(p=>p.lesson_id===it.lesson_id&&norm(p.es)!==norm(it.es)&&!/^\d+$/.test(p.es)).map(p=>T(p.es)); const rest=pool.filter(p=>norm(p.es)!==norm(it.es)&&!/^\d+$/.test(p.es)).map(p=>T(p.es)); const esPool=[...new Set([...shuffle(same),...shuffle(rest)])];
      ex.push({...base,mode:"recognize",opts:shuffle([T(it.es),...esPool.slice(0,3)])});
      ex.push({...base,mode:"copy"});
      continue; }
    if(opts.forceTransform&&it.tr){ ex.push({key:it.key,eu:it.eu,es:T(it.es),lesson_id:it.lesson_id,emoji:it.emoji||"",mode:"transform",from:it.eu,instr:T(it.tr.i),to:it.tr.to,toEs:T(it.tr.es||""),opts:shuffle([it.tr.to,...shuffle([...new Set(pool.map(p=>p.eu).filter(x=>norm(x)!==norm(it.tr.to)&&norm(x)!==norm(it.eu)))]).slice(0,3)])}); }
    else ex.push(buildEx(it,pool)); }

}

function renderChallenge(c,fid=new Set()){
  const otherId=c.mine?c.toId:c.fromId; const stranger=otherId&&otherId!==P.id&&!fid.has(otherId);
  const who=`<div class="who"><span class="av">${esc(c.from[0].toUpperCase())}</span>${esc(c.from)}${c.mine?" "+T("(tú)"):""} <span class="muted">→</span> <span class="av">${esc(c.to[0].toUpperCase())}</span>${esc(c.to)}${c.forMe?" "+T("(tú)"):""}${c.payload&&c.payload.random?` <span class="pill" style="margin-left:4px">${L2("al azar","random")}</span>`:""}${stranger?`<button class="link" data-addf="${otherId}" style="margin-left:auto;font-size:12px">+ Gehitu</button>`:""}</div>`;
  if(c.kind==="duel"){
    const a=c.fromResult, b=c.toResult;
    if(a&&b) return `<div class="ch">${who}<div class="vs"><b class="${a.score>b.score?"w":""}">${a.score}/${a.total}</b><span class="muted">vs</span><b class="${b.score>a.score?"w":""}">${b.score}/${b.total}</b></div><p class="hint" style="text-align:center">${a.score===b.score?T("Berdinketa · empate"):(a.score>b.score?c.from:c.to)+" "+T("irabazle · gana")}</p></div>`;
    if(c.forMe&&!b) return `<div class="ch">${who}<p>${esc(c.from)} ${T("te reta:")} ${c.payload.transform?T("6 transformaciones"):T("6 frases escribiendo")}. ${a?`${T("Ya ha hecho")} ${a.score}/${a.total}.`:""}</p><button class="btn red sm bi" data-play="${c.id}">Onartu<small>${T("Jugar")}</small></button></div>`;
    return `<div class="ch">${who}<p class="hint">${T("Tu resultado:")} ${a?a.score+"/"+a.total:"–"}. ${T("Esperando a")} ${esc(c.to)}.</p></div>`;
  }
  const r=c.toResult, mine=c.fromResult||{};
  return `<div class="ch">${who}<p style="font-size:15px">${esc(c.payload.text)}</p><p><b style="color:var(--red)">${esc(mine.answer||"")}</b></p>
    ${r?`<p class="hint">${r.ok?T("✅ Confirmado por")+" "+esc(c.to):T("✏️ Corrección de")+" "+esc(c.to)+": <b>"+esc(r.fix||"")+"</b>"}</p>`:c.forMe?`<p class="hint">${T("¿Es lo que dijiste? Si no, escribe la forma correcta.")}</p><input class="ans" data-fix="${c.id}" placeholder="${T("Corrección (opcional)")}"><div class="row"><button class="btn sm bi" data-ok="${c.id}" data-v="1">Zuzena ✓<small>${T("Correcto")}</small></button><button class="btn ghost sm bi" data-ok="${c.id}" data-v="0">Zuzendu<small>${T("Corregir")}</small></button></div>`:`<p class="hint">${T("Esperando confirmación de")} ${esc(c.to)}.</p>`}</div>`;
}
async function finishChallenge(score,total){
  const c=SES.challenge; const answers=SES.answers;
  try{
    if(c.id) await api(`challenges/${c.id}/result`,{result:{score,total}});
    else if(c.random) await api("challenges/random",{payload:{items:c.items,transform:!!c.transform},fromResult:{score,total}});
    else await api("challenges",{toId:c.toId,kind:"duel",payload:{items:c.items,transform:!!c.transform},fromResult:{score,total}});
    P=await api("round",{lessonId:null,ok:score,total:Math.max(total,1)});
  }catch(e){ toast(e.message); }
  app.innerHTML=`<div class="head pad" style="padding-bottom:28px;text-align:center"><div class="lb">${LAUBURU}</div><p class="eyebrow" data-es="${T("Reto terminado")}">Erronka amaituta</p><h1 style="margin-top:6px">${score}/${total}</h1><p class="sub" style="max-width:none">${c.id?T("Resultado enviado. Mira el marcador en Taldea."):T("Reto enviado. Cuando conteste, veréis el marcador en Taldea.")}</p></div><div class="stack pad" style="padding-top:18px"><button class="btn bi" id="home">Taldera<small>${T("ir a Taldea")}</small></button></div>`;
  document.getElementById("home").onclick=()=>setTab("taldea");
}

  app.innerHTML=`<div class="head pad" style="padding-bottom:26px"><div class="lb">${LAUBURU}</div><div class="row" style="gap:18px;position:relative"><div class="olen">${OLEN("wave",80)}</div><div><p class="eyebrow">Euskara praktika</p><h1>Ongi etorri!</h1><p style="color:var(--on-color);font-weight:600;font-size:13px">Bienvenido/a · Welcome</p></div></div></div>
   <div class="stack pad" style="padding-top:22px"><p class="eyebrow">Zein hizkuntzatan?</p><p class="muted">Las traducciones y explicaciones, ¿en qué idioma?<br>Translations and explanations in which language?</p>
    <button class="btn red" data-lang="es">Gaztelania<small>Castellano</small></button><button class="btn" data-lang="en">Ingelesa<small>English</small></button></div>`;

const _renderLogin=renderLogin; renderLogin=function(){ if(!LANG) return renderLangPick(); _renderLogin(); const cl=document.getElementById("chlang"); if(cl) cl.onclick=()=>{ setLang(LANG==="en"?"es":"en"); applyStatic(); renderLogin(); }; };
applyStatic();
api("me").then(async p=>{ P=p; if(P.lang&&P.lang!==LANG){ setLang(P.lang); applyStatic(); } await Promise.all([loadItems(),checkVoice()]); const h=location.hash.replace("#",""); if(!P.profile.gender) renderProfile(true); else setTab(["gaur","ikasgaiak","taldea","datuak"].includes(h)?h:"gaur"); }).catch(()=>renderLogin());
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
