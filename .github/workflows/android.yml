# Compila la app Android (Capacitor) y deja el paquete .aab firmado listo para subir a Google Play.
# Se ejecuta al cambiar algo en mobile/ o a mano desde la pestaña Actions ("Run workflow").
name: Android

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versión visible (p. ej. 1.0.2)"
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Dependencias
        run: npm ci
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Clave de firma
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Compilar (release, firmado)
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/upload.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Paquete para Google Play (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: euskara-praktika-${{ github.run_number }}-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
      - name: APK para instalar a mano en un móvil
        uses: actions/upload-artifact@v4
        with:
          name: euskara-praktika-${{ github.run_number }}-apk
          path: mobile/android/app/build/outputs/apk/release/app-release*.apk
