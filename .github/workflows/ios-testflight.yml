# Archiva la app iOS firmada y la sube a TestFlight. Solo a mano (Actions → iOS TestFlight → Run workflow).
# Necesita estos secretos en GitHub (ver mobile/README.md, apartado iOS):
#   IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD   certificado de distribución (Apple Distribution) exportado de Keychain como .p12, en base64
#   IOS_PROFILE_BASE64                        perfil de aprovisionamiento App Store (.mobileprovision) en base64
#   APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_PRIVATE_KEY   clave de la API de App Store Connect (.p8, contenido completo)
#   APPLE_TEAM_ID                             identificador del equipo (10 caracteres)
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versión visible (p. ej. 1.0.2)"
        default: "1.0.0"

jobs:
  testflight:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Dependencias
        run: npm ci
      - name: Sincronizar Capacitor
        run: npx cap sync ios
      - name: Instalar certificado y perfil
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PWD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -e
          KC=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          echo "$CERT_B64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$CERT_PWD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KC"
          security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > $RUNNER_TEMP/app.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/app.mobileprovision)")
          cp $RUNNER_TEMP/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
      - name: Versión
        run: |
          cd ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ github.event.inputs.version_name }}" App/Info.plist || true
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = ${{ github.event.inputs.version_name }};/g; s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" App.xcodeproj/project.pbxproj
      - name: Archivar
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -archivePath $RUNNER_TEMP/App.xcarchive archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" | tail -30
      - name: Exportar .ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > $RUNNER_TEMP/export.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string><key>teamID</key><string>$TEAM_ID</string><key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict><key>eus.euskarapraktika.app</key><string>$PROFILE_UUID</string></dict>
          <key>uploadSymbols</key><true/></dict></plist>
          PL
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/export | tail -10
      - name: Subir a TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys && echo "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app --type ios --file $RUNNER_TEMP/export/App.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: euskara-praktika-ios
          path: ${{ runner.temp }}/export/App.ipa
